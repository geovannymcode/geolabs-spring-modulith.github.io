site_name: "Workshop: Monolito Modular Real con Spring Modulith"
site_description: "De un monolito acoplado a una arquitectura modular de producción"
site_author: "Geovanny Mendoza — BarranquillaJUG"
site_url: "https://geolabs-spring-modulith.github.io"

repo_name: "geovannymcode/bookstore-modulith"
repo_url: "https://github.com/geovannymcode/bookstore-modulith"

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Partes del Workshop:
    - "Parte 0 — El Antes": parte_0.md
    - "Parte 1 — Migración y Setup": parte_1.md
    - "Parte 2 — Boundaries y Reglas": parte_2.md
    - "Parte 3 — CQRS en Módulos": parte_3.md
    - "Parte 4 — Eventos y Outbox": parte_4.md
    - "Parte 5 — Testing en Aislamiento": parte_5.md
    - "Parte 6 — C4 Docs y Producción": parte_6.md
  - Referencias: referencias.md
